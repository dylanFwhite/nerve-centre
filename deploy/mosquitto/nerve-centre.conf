# nerve-centre broker settings

# Listen on the home network (IPv4 only), port 1883
listener 1883 0.0.0.0

# Every client must log in
allow_anonymous false
password_file /etc/mosquitto/passwd

# Save retained messages and queued messages to disk every 60 s,
# not just at shutdown, so a power cut loses at most a minute
autosave_interval 60

# Forget persistent sessions of clients that haven't connected for 7 days
persistent_client_expiration 7d
